<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
    <h1>Búscar pokemones</h1>
    </header>
    <div class="wrap">
        <div class="tabs" id="tabs">

        </div>
        <!--fetch .then/ .catch -->
        <div class="panel active" data-panel="then">
            <h2>Fetch</h2>
            <p><code>fetch()</code> devuelve una promesa que resuelve la petición HTTP. Recuerden convertir a <code>.json</code></p>
            <div class="quick-btns">
                <button data-name="pikachu">Pikachu</button>
                <button data-name="ditto">Ditto</button>
                <button data-name="charizard">Charizard</button>
                <button data-name="mewtwo">Mewtwo</button>
                <button data-name="inteleon">inteleon</button>
            </div>
            <div class="search-box">
                <input type="text" id="inputThen" placeholder="Ejemplo: bulbasaur">
                <button class="run" id="buttonThen">Buscar</button>
            </div>
            <div class="status" id="statusThen"></div>
            <div class="result" id="resultThen">
                <img src="" alt="" id="imgThen">
                <div id="nameThen"></div>
                <div class="stats" id="statsThen"></div>
            </div>
        </div>
        <!--2. Async/await-->
        <div class="panel" data-panel="await">
            <h2>Await / Async</h2>
            <p>Misma peticion HTTP, pero de manera secuencial con 
                <code>try/catch</code>
            </p>
            <div class="search-box">
                <input type="text" id="inputAwait" placeholder="Ejemplo rattata">
                <button class="run" id="buttonAwait">Buscar</button>
            </div>
            <div class="status" id="statsAwait"></div>
            <div class="result" id="resultAwait"></div>
            <img src="" alt="" id="imgAwait">
            <h3 id="nameAwait"></h3>
            <div class="stats" id="statsAwait"></div>
        </div>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
