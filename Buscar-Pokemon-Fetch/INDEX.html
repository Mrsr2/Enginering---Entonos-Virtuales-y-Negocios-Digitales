<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch Buscar Pokémones</title>
</head>

<body>
    <header>
        <h1>Buscar Pokémones</h1>
    </header>
    <div class="wrap">
        <div class="taps" id="taps">



        </div>

        <!--  1.Fetch => .them / catch-->
        <div class="panel active" data-panel="then">
            <h2>Fetch</h2>
            <p><code> fetch() </code>devuelve una promesa que resuelve la peticion HTTP. Recordar convertir a
                <code>.JSON</code>
            </p>
            <div class="quick-btns">
                <button data-name="pikachu">Pikachu</button>
                <button data-name="snporlax">Snorlax</button>
                <button data-name="charizart">Charizart</button>
                <button data-name="mewto">mewto</button>
                <button data-name="VamoACalmarno">Vamo a calmarno</button>
                <div class="search-box">
                    <input type="text" id="inputThen" placeholder="Ejemplo: Vamo a Calmarno">
                    <button class="run" id="buttonThen">Buscar</button>
                </div>
                <div class="status" id="statusThen"></div>
                <div class="result" id="resultThen">
                    <img src="" alt="" id="imgThen">
                    <div id="nameThen"></div>
                    <div class="stats" id="statsThen"></div>


                </div>

            </div>
            <!--2. Async/await-->

            <div class="panel" data-panel="await"></div>
            <div class="serch-box">
                <input type="text" id="imputAwait" placeholder="Ejemplo: ratata">
                <button class="run" id="buttonAwait">Buscar</button>
            </div>
            <div class="status" id="statusAwait"></div>
            <div class="result" id="resultAwait"> </div>
            <img src="" alt="" id="imgAwait">
            <h3 id="nameAwait"></h3>
            <div class="status" id="statusAwait"> </div>
        </div>

        <script src="Js/script.js"></script>
</body>

</html>
